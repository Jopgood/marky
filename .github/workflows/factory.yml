# Marky Factory: the always-on trigger layer (our stand-in for Warp Factories).
# Each event runs .factory/runner/run-stage.mjs, which walks the blueprint in
# .factory/factory.yaml with headless Claude Code workers.
name: factory

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [error-monitor, linear-issue, linear-comment, linear-poll]
  # Linear intake: the relay (.factory/relay) sends linear-poll on each Linear
  # webhook; the cron is a backstop for dropped webhooks.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# One task per issue at a time; queued events run after the current one.
concurrency:
  group: factory-${{ github.event.issue.number || github.event.client_payload.issue || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  linear-intake:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'linear-poll')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: factory-linear-intake
    env:
      GH_TOKEN: ${{ github.token }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .factory
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          npm install --prefix .factory/runner --no-package-lock --silent
          node .factory/runner/linear-intake.mjs

  run:
    # Cheap pre-filter; the runner re-checks everything.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'factory') ||
      (github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'repository_dispatch' && github.event.action != 'linear-poll')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN || github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      FACTORY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GH_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          npm install --prefix .factory/runner --no-package-lock --silent
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb ffmpeg >/dev/null
          git config user.name "marky-factory[bot]"
          git config user.email "marky-factory@users.noreply.github.com"

      - name: Run factory
        env:
          FACTORY_ARTIFACTS: ${{ runner.temp }}/factory-artifacts
        run: node .factory/runner/run-stage.mjs

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-artifacts
          if-no-files-found: ignore
          retention-days: 30
